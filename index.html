<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はなちょうちんパッチン！</title>
  
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React本体とBabel (ブラウザでReactを動かすため) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- アプリが表示される場所 -->
  <div id="root"></div>

  <!-- アプリのコード -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const App = () => {
      const [isSleeping, setIsSleeping] = useState(true);
      const [popEffect, setPopEffect] = useState(null);
      const [totalScore, setTotalScore] = useState(0);
      const [wakeCount, setWakeCount] = useState(0);
      const [bubbleScale, setBubbleScale] = useState(1);
      const animationRef = useRef(null);
      const startTimeRef = useRef(Date.now());

      useEffect(() => {
        if (!isSleeping) {
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
          return;
        }

        startTimeRef.current = Date.now();
        
        const animate = () => {
          const now = Date.now();
          const elapsed = now - startTimeRef.current;
          const cycleProgress = (elapsed % 3500) / 3500;
          const sineValue = Math.sin(cycleProgress * Math.PI); 
          const currentScale = 1 + (1.5 * sineValue);
          
          setBubbleScale(currentScale);
          animationRef.current = requestAnimationFrame(animate);
        };

        animationRef.current = requestAnimationFrame(animate);

        return () => {
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
        };
      }, [isSleeping]);

      const handlePop = () => {
        if (!isSleeping) return;

        let score = 10;
        let effectType = 'normal';
        let message = "Good!";
        let messageColor = "#4ADE80";

        if (bubbleScale > 2.3) {
          score = 100;
          effectType = 'perfect';
          message = "PERFECT!!";
          messageColor = "#F59E0B";
        } else if (bubbleScale > 1.8) {
          score = 50;
          effectType = 'great';
          message = "Great!";
          messageColor = "#3B82F6";
        }

        setPopEffect({ type: effectType, score, message, color: messageColor });
        setTotalScore((prev) => prev + score);
        setWakeCount((prev) => prev + 1);
        setIsSleeping(false);

        setTimeout(() => {
          setPopEffect(null);
        }, 800);

        setTimeout(() => {
          setIsSleeping(true);
        }, 2500);
      };

      return (
        <div className="min-h-screen bg-sky-100 flex flex-col items-center justify-center p-4 font-sans touch-manipulation select-none">
          <style>
            {`
              @keyframes breathe { 0% { transform: scale(1); } 50% { transform: scale(2.5); } 100% { transform: scale(1); } }
              .snot-bubble-group { animation: breathe 3.5s infinite linear; transform-origin: 110px 135px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
              .snot-bubble-base { transition: fill 0.2s, stroke 0.2s; }
              .snot-bubble-group:hover .snot-bubble-base { fill: rgba(135, 206, 235, 0.8); stroke: rgba(70, 130, 180, 0.9); }
              @keyframes floatZzz { 0% { opacity: 0; transform: translate(0px, 0px) scale(0.8); } 20% { opacity: 1; transform: translate(5px, -10px) scale(1); } 80% { opacity: 1; transform: translate(15px, -30px) scale(1.1); } 100% { opacity: 0; transform: translate(20px, -40px) scale(1.2); } }
              .zzz-anim { animation: floatZzz 3.5s infinite linear; }
              @keyframes popBurst { 0% { opacity: 1; transform: scale(0.5); } 100% { opacity: 0; transform: scale(1.8); } }
              .pop-anim-normal { animation: popBurst 0.3s ease-out forwards; transform-origin: 110px 130px; }
              @keyframes perfectBurst { 0% { opacity: 1; transform: scale(0.5) rotate(0deg); stroke-width: 4px; } 50% { opacity: 1; transform: scale(2) rotate(45deg); stroke-width: 6px; } 100% { opacity: 0; transform: scale(3) rotate(90deg); stroke-width: 2px; } }
              .pop-anim-perfect { animation: perfectBurst 0.5s ease-out forwards; transform-origin: 110px 130px; }
              @keyframes floatScore { 0% { opacity: 0; transform: translateY(10px) scale(0.5); } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 80% { opacity: 1; transform: translateY(-30px) scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(0.8); } }
              .score-text-anim { animation: floatScore 0.8s ease-out forwards; }
              @keyframes sleepBob { 0% { transform: translateY(0); } 50% { transform: translateY(4px); } 100% { transform: translateY(0); } }
              .sleeping-bear { animation: sleepBob 3.5s infinite linear; transform-origin: center; }
              @keyframes awakeShake { 0% { transform: translateY(0) rotate(0deg); } 20% { transform: translateY(-5px) rotate(-2deg); } 40% { transform: translateY(-5px) rotate(2deg); } 60% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(0) rotate(0deg); } }
              .awake-bear { animation: awakeShake 0.5s ease-out; transform-origin: center; }
            `}
          </style>

          <div className="bg-white rounded-3xl shadow-xl p-6 md:p-8 text-center max-w-md w-full border-4 border-sky-200">
            <h1 className="text-2xl md:text-3xl font-bold text-sky-800 mb-2 tracking-wider">
              はなちょうちん<br/>パッチン！
            </h1>
            <p className="text-gray-600 mb-2 text-sm md:text-base font-medium">
              大きく膨らんだ時を狙ってタップ！
            </p>
            <div className="flex justify-center gap-4 mb-4 text-xs">
              <span className="bg-green-100 text-green-700 px-2 py-1 rounded">小: 10点</span>
              <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded">中: 50点</span>
              <span className="bg-amber-100 text-amber-700 px-2 py-1 font-bold rounded">大: 100点!!</span>
            </div>

            <div className="relative mx-auto w-72 h-72 bg-amber-50 rounded-2xl border-4 border-amber-100 flex items-center justify-center overflow-visible">
              <svg viewBox="0 0 200 200" className="w-full h-full overflow-visible">
                {isSleeping && (
                  <g className="zzz-anim">
                    <text x="135" y="60" fontSize="22" fill="#888" fontWeight="bold" fontFamily="sans-serif">Z</text>
                    <text x="155" y="45" fontSize="16" fill="#888" fontWeight="bold" fontFamily="sans-serif">z</text>
                    <text x="170" y="35" fontSize="12" fill="#888" fontWeight="bold" fontFamily="sans-serif">z</text>
                  </g>
                )}

                <g className={isSleeping ? 'sleeping-bear' : 'awake-bear'}>
                  <circle cx="55" cy="75" r="22" fill="#A0522D" />
                  <circle cx="145" cy="75" r="22" fill="#A0522D" />
                  <circle cx="55" cy="75" r="12" fill="#F5DEB3" />
                  <circle cx="145" cy="75" r="12" fill="#F5DEB3" />
                  <circle cx="100" cy="120" r="55" fill="#D2B48C" />
                  <circle cx="65" cy="125" r="12" fill="#FFB6C1" opacity={isSleeping ? "0.4" : "0"} />
                  <circle cx="135" cy="125" r="12" fill="#FFB6C1" opacity={isSleeping ? "0.4" : "0"} />
                  <circle cx="100" cy="135" r="24" fill="#FFE4B5" />
                  <ellipse cx="100" cy="125" rx="9" ry="6" fill="#3E2723" />
                  
                  {!isSleeping && (
                    <path d="M 95 145 Q 100 155 105 145" stroke="#3E2723" strokeWidth="3" fill="none" strokeLinecap="round" />
                  )}

                  {isSleeping ? (
                    <g>
                      <path d="M 65 110 Q 75 118 85 110" stroke="#3E2723" strokeWidth="3.5" fill="none" strokeLinecap="round" />
                      <path d="M 115 110 Q 125 118 135 110" stroke="#3E2723" strokeWidth="3.5" fill="none" strokeLinecap="round" />
                    </g>
                  ) : (
                    <g>
                      <circle cx="75" cy="105" r="7" fill="#3E2723" />
                      <circle cx="125" cy="105" r="7" fill="#3E2723" />
                      <circle cx="73" cy="103" r="2" fill="#FFF" />
                      <circle cx="123" cy="103" r="2" fill="#FFF" />
                      <path d="M 65 92 L 85 87" stroke="#3E2723" strokeWidth="3" fill="none" strokeLinecap="round" />
                      <path d="M 135 92 L 115 87" stroke="#3E2723" strokeWidth="3" fill="none" strokeLinecap="round" />
                      <text x="145" y="80" fontSize="32" fill="#FF4500" fontWeight="bold" fontFamily="sans-serif">!</text>
                    </g>
                  )}
                </g>

                {isSleeping && (
                  <g className="snot-bubble-group" onClick={handlePop}>
                    <circle cx="110" cy="135" r="14" fill="rgba(173, 216, 230, 0.6)" stroke="rgba(135, 206, 235, 0.8)" strokeWidth="2" className="snot-bubble-base" />
                    <path d="M 103 128 Q 110 123 117 128" stroke="rgba(255, 255, 255, 0.7)" strokeWidth="2" fill="none" strokeLinecap="round" style={{ pointerEvents: 'none' }} />
                  </g>
                )}

                {popEffect && (
                  <g>
                    <g className={popEffect.type === 'perfect' ? 'pop-anim-perfect' : 'pop-anim-normal'}>
                      <path d="M 110 115 L 110 100 M 110 155 L 110 170 M 90 135 L 75 135 M 130 135 L 145 135 M 95 120 L 85 110 M 125 150 L 135 160 M 125 120 L 135 110 M 95 150 L 85 160" stroke={popEffect.type === 'perfect' ? '#F59E0B' : '#87CEEB'} strokeWidth="3" strokeLinecap="round" />
                      {popEffect.type === 'perfect' && (
                        <g fill="#FBBF24">
                          <polygon points="110,85 115,95 125,95 117,102 120,112 110,107 100,112 103,102 95,95 105,95" />
                        </g>
                      )}
                    </g>
                    <g className="score-text-anim" style={{ pointerEvents: 'none' }}>
                      <text x="110" y="110" fontSize="24" fill="white" fontWeight="900" fontFamily="sans-serif" textAnchor="middle" stroke="white" strokeWidth="4" strokeLinejoin="round">{popEffect.message}</text>
                      <text x="110" y="110" fontSize="24" fill={popEffect.color} fontWeight="900" fontFamily="sans-serif" textAnchor="middle">{popEffect.message}</text>
                      <text x="110" y="135" fontSize="20" fill="white" fontWeight="900" fontFamily="sans-serif" textAnchor="middle" stroke="white" strokeWidth="4" strokeLinejoin="round">+{popEffect.score}</text>
                      <text x="110" y="135" fontSize="20" fill={popEffect.color} fontWeight="900" fontFamily="sans-serif" textAnchor="middle">+{popEffect.score}</text>
                    </g>
                  </g>
                )}
              </svg>
            </div>

            <div className="mt-6 flex justify-center gap-4 w-full">
              <div className="bg-gray-50 rounded-xl p-3 flex-1 border-2 border-gray-200">
                <div className="text-gray-500 text-xs font-bold mb-1">起こした回数</div>
                <div>
                  <span className="text-xl font-black text-gray-700">{wakeCount}</span>
                  <span className="text-sm font-bold ml-1 text-gray-500">回</span>
                </div>
              </div>
              <div className="bg-sky-50 rounded-xl p-3 flex-1 border-2 border-sky-200 shadow-inner">
                <div className="text-sky-600 text-xs font-bold mb-1">合計スコア</div>
                <div>
                  <span className="text-3xl font-black text-sky-600">{totalScore}</span>
                  <span className="text-sm font-bold ml-1 text-sky-600">pt</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Reactアプリの描画
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
